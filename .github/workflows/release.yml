name: Build and publish Windows release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '正式版本，例如 1.3.0（须与 VERSION 一致）'
        required: true
        type: string
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate release version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and VERSION differ' }
          if ($env:REQUESTED_VERSION -and $env:REQUESTED_VERSION -ne $version) { throw 'Input and VERSION differ' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --global pnpm@11.7.0
          pnpm --dir dashboard install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          choco install nsis --version=3.12.0 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'
      - name: Validate portable dashboard and runtime
        shell: pwsh
        run: |
          pnpm --dir dashboard run typecheck:portable
          if ($LASTEXITCODE -ne 0) { throw 'Type check failed' }
          pnpm --dir dashboard run lint:portable
          if ($LASTEXITCODE -ne 0) { throw 'Lint failed' }
          pnpm --dir dashboard run test:regression
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
      - name: Build installer and checksum
        shell: pwsh
        run: |
          & ./installer/build-installer.ps1 -Version $env:RELEASE_VERSION -GitHubRepository $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Verify isolated installation and data preservation
        shell: pwsh
        run: |
          & ./tests/installer.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer regression failed' }
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WorktimeAssistant-${{ env.RELEASE_VERSION }}
          path: release/*
      - name: Publish complete stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; choose a new version' }
          $installer = "release/WorktimeAssistant-Setup-$env:RELEASE_VERSION.exe"
          $notes = "release-notes/$env:RELEASE_VERSION.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Release notes are missing' }
          # Draft releases do not appear in the app until every asset is uploaded.
          gh release create $tag $installer "$installer.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "工时助手 $env:RELEASE_VERSION" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed; release remains unpublished' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
